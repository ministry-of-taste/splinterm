name: CI

on:
  push:
    branches: [main, "maint/0.1"]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Supersede only pull-request runs. Every other run gets a unique group: a
# shared group would let a newer main push replace an older pending one, and
# each authority-branch push and merge group must complete for its own SHA.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  preflight:
    name: Fast release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate deterministic release state
        run: python tools/release/release-doctor.py
      - name: Require every release tag in main's history
        # Maintenance releases reach main by merge; a missing tag means
        # maint/0.1 has not been merged forward. A merge group for main has an
        # empty base_ref and a gh-readonly-queue ref, so match its base instead.
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event.merge_group.base_ref == 'refs/heads/main'
        run: python tools/release/check-release-ancestry.py
      - name: Validate executable workflow syntax with pinned actionlint
        # actionlint v1.7.7 multi-platform image index.
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

  changes:
    name: Select path-gated pull-request boundaries
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.select.outputs.nix }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the NixOS boundary from the pull-request range
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pushes and merge groups always run every boundary.
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'nix=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request whose payload omits either revision (GitHub may
          # send an empty one for forks) cannot be gated, so it runs nix.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo 'Pull-request revisions are missing; running every boundary.'
            echo 'nix=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a move; a failed diff fails closed.
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" >changed-paths.txt
          cat changed-paths.txt
          if grep -Eq '^(nix/|packaging/|dist/|config/|tools/automation/|tools/package/)|^(flake\.nix|flake\.lock|Cargo\.lock|rust-toolchain.*|\.github/workflows/ci\.yml|crates/splinterm/src/(app/local_service|remote|renderer/fonts|wayland)\.rs)$|(^|/)Cargo\.toml$' changed-paths.txt; then
            echo 'nix=true' >>"$GITHUB_OUTPUT"
          else
            echo 'nix=false' >>"$GITHUB_OUTPUT"
          fi

  static:
    name: Rust format, clippy, and shell static checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rmcp 2.2.0's macros require Rust 1.88; keep CI on the workspace MSRV.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: shellcheck install.sh tools/package/build-local-package.sh tools/package/upgrade-local-package.sh tools/testbed/omarchy-vm.sh tools/agents/provision-arch-worker.sh
      - run: cargo clippy --frozen --workspace --all-targets -- -D warnings

  workspace-tests:
    name: Workspace unit and non-daemon/non-MCP integration tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus fonts-noto-cjk libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Install pinned renderer test fonts
        run: |
          font_dir="$HOME/.local/share/fonts/splinterm-ci"
          base='https://raw.githubusercontent.com/ryanoasis/nerd-fonts/fa7b859994228a9c8759f99c55a8d31ee92a1b5e/patched-fonts/JetBrainsMono/Ligatures'
          mkdir -p "$font_dir"
          for style in Regular Bold Italic BoldItalic; do
            curl --fail --location --silent --show-error \
              "$base/$style/JetBrainsMonoNerdFont-$style.ttf" \
              --output "$font_dir/JetBrainsMonoNerdFont-$style.ttf"
          done
          (
            cd "$font_dir"
            sha256sum --check <<'CHECKSUMS'
          0ec29a68b539ece7078fc714cebff0c0accb2f4948f8f7963d9f5e86633b12d9  JetBrainsMonoNerdFont-Regular.ttf
          e82e27a7f37c9a0a13cc4e417503a149c6a0280586930772d2ebed803159c864  JetBrainsMonoNerdFont-Bold.ttf
          981133a258ef4c62769a7a7214a4b455ac1c63923784a70f50c48977b67f7025  JetBrainsMonoNerdFont-Italic.ttf
          961222be7bce59f310b41a3e158368d5ea22a47a0ac31defd57caac9b9e82cb0  JetBrainsMonoNerdFont-BoldItalic.ttf
          CHECKSUMS
          )
          fc-cache --force
          fc-match 'JetBrains Mono Nerd Font:style=Bold' | grep -F 'JetBrainsMonoNerdFont-Bold.ttf'
          fc-match 'Noto Sans CJK JP:style=Regular' | grep -F 'NotoSansCJK-Regular.ttc'
      - name: Build the PTY child helper required by daemon live tests
        run: cargo build --frozen -p splinterm-pty --bin splinterm-pty-child
      - name: Run workspace unit, binary, example, and documentation tests
        run: |
          set -o pipefail
          {
            cargo test --frozen --workspace --lib --bins --examples -- --test-threads=1
            cargo test --frozen --workspace --doc -- --test-threads=1
          } 2>&1 | tee workspace-tests.log
      - name: Run every remaining Rust integration target exactly once
        run: |
          set -o pipefail
          {
            cargo test --frozen -p splinterd \
              --test handoff_descriptors_audit -- --test-threads=1
            cargo test --frozen -p splinterd \
              --test handoff_descriptors_exec --test unsafe_boundary_audit \
              --test handoff_exec_production -- --test-threads=1
            cargo test --frozen -p splinterm-inherited-fd \
              --test post_exec_claim -- --test-threads=1
            # The handoff runtime-stop session-bus stage must not skip in CI.
            SPLINTERD_REQUIRE_SESSION_BUS=1 \
              cargo test --frozen --workspace --features splinterd/integration-test \
              --test sealed_preflight_binary --test candidate_bootstrap_exec \
              --test handoff_runtime_stop --test handoff_exec_resume \
              --test handoff_exec_adoption -- --test-threads=1
            cargo test --frozen -p splinterm-pty \
              --test linux_pty --test pty_adoption_exec -- --test-threads=1
            cargo test --frozen -p splinterm-relay --test stdio -- --test-threads=1
            cargo test --frozen -p splinterm-terminal \
              --test checkpoint --test images --test iterm --test kitty --test memory_layout \
              --test oracle_fixtures --test snapshot -- --test-threads=1
            cargo test --frozen -p splinterm \
              --test approvals_cli --test automation_cli --test diagnostics_subprocess --test keymap_cli --test mcp_setup_cli \
              --test policy_cli --test preset_schema --test remote_askpass --test remote_cli \
              --test remote_session --test shell_cli --test window_resume_exec \
              -- --test-threads=1
          } 2>&1 | tee -a workspace-tests.log
      - name: Upload focused workspace failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: workspace-test-failure-${{ github.run_id }}
          path: workspace-tests.log
          if-no-files-found: error
          retention-days: 14

  daemon-tests:
    name: Daemon end-to-end tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Build the PTY child helper and relay required by daemon integration tests
        run: >-
          cargo build --frozen -p splinterm-pty --bin splinterm-pty-child
          -p splinterm-relay --bin splinterm-relay
      - name: Run daemon integration target without retry
        run: |
          set -o pipefail
          cargo test --frozen -p splinterd --test end_to_end -- --test-threads=1 \
            2>&1 | tee daemon-end-to-end.log
      - name: Upload focused daemon failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: daemon-end-to-end-failure-${{ github.run_id }}
          path: daemon-end-to-end.log
          if-no-files-found: error
          retention-days: 14

  mcp-tests:
    name: MCP protocol tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libpixman-1-dev libxkbcommon-dev pkg-config
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Run MCP integration targets without retry
        run: |
          set -o pipefail
          cargo test --frozen -p splinterm-mcp \
            --test schema_inventory --test stdio_protocol -- --test-threads=1 \
            2>&1 | tee mcp-protocol.log
      - name: Build the staged binaries for the headless MCP preflight
        run: cargo build --frozen --bin splinterd --bin splinterm --bin splinterm-mcp
      - name: Run the headless staged MCP preflight (Plan 0031)
        # Log and evidence live outside the checkout so the recorded source
        # identity describes the tree itself.
        run: |
          set -o pipefail
          mkdir -m 700 "$RUNNER_TEMP/mcp-preflight-evidence"
          python tools/mcp/run-demo.py preflight --staged-bin-dir target/debug \
            --evidence-dir "$RUNNER_TEMP/mcp-preflight-evidence" \
            2>&1 | tee "$RUNNER_TEMP/mcp-preflight.log"
      - name: Upload focused MCP failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: mcp-protocol-failure-${{ github.run_id }}
          path: |
            mcp-protocol.log
            ${{ runner.temp }}/mcp-preflight.log
            ${{ runner.temp }}/mcp-preflight-evidence/
          if-no-files-found: error
          retention-days: 14

  package-automation:
    name: Package and release automation tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run package/release Python boundary
        run: |
          set -o pipefail
          python -m unittest \
            tools/automation/test_dojo_picker.py \
            tools/testbed/test_font_fixture.py \
            tools/testbed/test_guest_window.py \
            tools/testbed/test_handoff_vm_acceptance.py \
            tools/testbed/test_omarchy_vm.py \
            tools/testbed/test_qmp_input.py \
            tools/package/test_release_manifest.py \
            tools/package/test_installer_safety.py \
            tools/package/test_package_provenance.py \
            tools/package/test_omarchy_screensaver_integration.py \
            tools/package/test_generate_omarchy_theme.py \
            tools/package/test_systemd_unit.py \
            tools/package/test_validate_mcp_package.py \
            tools/package/test_workload_units.py \
            tools/package/test_renderer_test_fonts.py \
            tools/release/test_ci_attestation.py \
            tools/release/test_check_release_ancestry.py \
            tools/release/test_prepare_candidate.py \
            tools/release/test_nix_ci_workflow.py \
            tools/release/test_rust_warning_gates.py \
            tools/release/test_promote_release.py \
            tools/release/test_release_doctor.py \
            tools/release/test_ci_workflow.py \
            tools/release/test_release_candidate_workflow.py \
            tools/release/test_promote_release_workflow.py \
            tools/release/test_recover_release_workflow.py \
            tools/release/test_distribute_aur.py \
            tools/release/test_distribute_aur_workflow.py \
            2>&1 | tee package-release-tests.log
      - name: Run agent runner contracts without remote services
        run: |
          set -o pipefail
          python -m unittest discover -s tools/agents -p 'test_*.py' -v \
            2>&1 | tee remote-agent-tests.log
      - name: Run MCP demo harness driver and preflight tests
        run: |
          set -o pipefail
          python -m py_compile tools/mcp/run-demo.py tools/mcp/mcp_host.py \
            tools/mcp/mcp_report.py tools/mcp/mcp_preflight.py
          python -m unittest discover -s tools/mcp/tests -p 'test_*.py' -v \
            2>&1 | tee mcp-demo-harness-tests.log
      - name: Upload focused package/release failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: package-release-failure-${{ github.run_id }}
          path: |
            package-release-tests.log
            remote-agent-tests.log
            mcp-demo-harness-tests.log
          if-no-files-found: error
          retention-days: 14

  renderer-contracts:
    name: Splinterm-owned renderer and contract fixtures
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python fixture dependencies
        run: python -m pip install 'jsonschema>=4.18' pillow pytest referencing
      - name: Validate source-owned contracts and benchmark reporting
        run: |
          set -o pipefail
          {
            python tools/benchmark/generate-semantic-fixture-vectors.py --check
            python tools/foot-oracle/validate-fixtures.py
            python tools/automation/validate-contract-fixtures.py
            python -m pytest -q tools/benchmark/test_benchmark.py
            python -m pytest -q tools/foot-oracle/test_run_final_buffer_comparison.py
          } 2>&1 | tee renderer-contracts.log
      - name: Upload focused renderer-contract failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: renderer-contract-failure-${{ github.run_id }}
          path: renderer-contracts.log
          if-no-files-found: error
          retention-days: 14

  nix:
    name: NixOS packages and headless lifecycle
    needs: [preflight, changes]
    # Pull requests skip this only when changes reports exactly 'false';
    # pushes and merge groups always run it.
    if: github.event_name != 'pull_request' || needs.changes.outputs.nix != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Use the Cachix binary cache when configured
        # Inert until the operator sets the CACHIX_CACHE variable.
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          # Only authority-branch pushes run landed code; pull requests and merge
          # groups run unmerged (possibly fork) code, so they get no token and
          # read the public cache without credentials.
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Require hardware virtualization for headless VM tests
        run: test -r /dev/kvm && test -w /dev/kvm
      - name: Check packages, module, and headless VMs
        run: nix flake check --print-build-logs --max-jobs 2 --cores 4

  arch-warning-check:
    name: Current Arch Rust warning-free sources
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Install current Arch compiler and native dependencies
        run: pacman -Syu --noconfirm --needed git rust fontconfig freetype2 pixman libxkbcommon pkgconf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record the distribution toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Deny warnings in release sources and test targets
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check --locked --workspace --all-targets
          cargo check --locked --release --workspace

  check:
    name: check
    if: ${{ always() }}
    needs:
      - preflight
      - changes
      - static
      - workspace-tests
      - daemon-tests
      - mcp-tests
      - package-automation
      - renderer-contracts
      - nix
      - arch-warning-check
    runs-on: ubuntu-latest
    steps:
      # Only a pull request whose changes job reported exactly nix=false may
      # skip nix; any other skipped, cancelled, or failed boundary fails.
      - name: Fail closed unless every mandatory boundary succeeded
        if: ${{ needs.preflight.result != 'success' || needs.changes.result != 'success' || needs.static.result != 'success' || needs.workspace-tests.result != 'success' || needs.daemon-tests.result != 'success' || needs.mcp-tests.result != 'success' || needs.package-automation.result != 'success' || needs.renderer-contracts.result != 'success' || (needs.nix.result != 'success' && !(github.event_name == 'pull_request' && needs.changes.outputs.nix == 'false' && needs.nix.result == 'skipped')) || needs.arch-warning-check.result != 'success' }}
        run: |
          echo 'One or more mandatory CI boundaries failed, were cancelled, or were skipped.' >&2
          exit 1
      - name: Confirm complete CI coverage
        if: ${{ needs.preflight.result == 'success' && needs.changes.result == 'success' && needs.static.result == 'success' && needs.workspace-tests.result == 'success' && needs.daemon-tests.result == 'success' && needs.mcp-tests.result == 'success' && needs.package-automation.result == 'success' && needs.renderer-contracts.result == 'success' && (needs.nix.result == 'success' || (github.event_name == 'pull_request' && needs.changes.outputs.nix == 'false' && needs.nix.result == 'skipped')) && needs.arch-warning-check.result == 'success' }}
        run: echo 'Every mandatory CI boundary succeeded.'
