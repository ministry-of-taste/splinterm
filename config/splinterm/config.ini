# Splinterm Phase 8 supported configuration subset.
# Install as ${XDG_CONFIG_HOME:-~/.config}/splinterm/config.ini.
[main]
# Leave font unset to follow Omarchy's effective Fontconfig monospace family.
# Setting font makes that pattern explicitly authoritative for this client.
# font=JetBrains Mono Nerd Font:style=Regular
# Leave the size unset to follow Omarchy's text size (shell.toml [font] base-size,
# px * 9/12 pt, live), or 14 px without one. Any size key opts out.
# font-pixelsize=14
# Window chrome (tabs, Explorer, menus, palette, pickers) has its own text size,
# unaffected by the terminal size and zoom. Leave it unset to follow Omarchy's
# text size (shell.toml [font] base-size in px, live), or 14 px without one.
# ui-font-pixelsize=14
font-sizing-policy=output-scale
padding-left=12
padding-right=12
padding-top=12
padding-bottom=12
initial-columns=80
initial-rows=24
# What the commandless desktop/XDG launch opens: new-dojo or dojo-picker.
# startup=new-dojo
login-shell=yes
# shell=/bin/bash
# title=Splinterm
resize-delay-ms=100
# Omarchy is the default theme source. Set this only to opt out with an
# explicit Splinterm JSON palette:
# theme=~/.config/splinterm/theme.json
# Under Omarchy 4 without the terminal tag from
# `splinterm integration omarchy enable`, the first graphical launch shows one
# desktop notification recommending it. Set no to never show it:
# omarchy-integration-hint=no

# Optional explicit overrides (normally owned by the active Omarchy theme):
# [colors]
# alpha=0.9
# blur=yes
#
# Window chrome backgrounds. Colours are #RRGGBB, alphas 0.0-1.0. By default
# the selected tab is opaque and the tab strip and Explorer follow alpha:
# active-tab-background=#3b4252
# active-tab-alpha=1.0
# tab-strip-alpha=0.65
# explorer-background=#2e3440
# explorer-alpha=0.65

[scrollback]
lines=1000

[multiplexer]
# Ordinary unnamed local graphical terminals remain durable by default.
persistent-by-default=yes
# Creating or explicitly naming a Dojo promotes its transient Lair.
persist-on-tab-organization=yes
# Draw a thin full-width line, as thin as a line divider, under the tab strip.
tab-strip-border=yes
# Where splits start: inherit, home, an absolute path, or ~/path.
new-splint-directory=inherit
# Where new Dojos and Lairs start; same choices.
new-dojo-directory=home
# Close Tab and Window close terminate Dojos that were never used.
close-unused=no
# line: shared dividers; frame: one titled frame per Splint; none: no chrome.
divider-style=line
# Empty logical px between neighbouring Splints and around them at the Window's
# edges (0-64), outside each frame or around the divider line. padding-* is the
# space inside each Splint. 0 is no gap.
# pane-gap=0
frame-title=splint

[cursor]
style=block
blink=yes

[explorer]
# Show explicitly reported agent status in the Explorer and on Dojo tabs.
agent-status=yes

[integration]
# Ctrl+Alt+G engages a waiting trusted dialog's keyboard, as a click inside
# does; it never answers. Under Hyprland it reaches the dialog from any
# Window while one waits. Use ctrl+alt+ with one letter or digit (no shift,
# no super), or none to turn it off.
dialog-shortcut=ctrl+alt+g

[key-bindings]
# The compatibility-preserving built-in profile remains the default.
profile=splinterm
# Optional strict TOML overlay, resolved relative to this config file.
# file=keybindings.toml
# Bounds the built-in omarchy-tmux profile's Ctrl+Space/Ctrl+B prefix state.
prefix-timeout-ms=1000

[presets]
# Optional strict user overlay for packaged Omarchy presets, resolved relative
# to this config file.
# file=presets.toml
# Explicitly enables packaged c/cx/cy direct argv; no shell evaluation.
allow-unrestricted-commands=no

# Color roles come from the active Omarchy theme, not this file.

# Optional explicit clipboard PNG saves (intended for 0.1.1).
# Create this absolute directory yourself with 0700 permissions; no symlinks.
# The palette action saves a persistent PNG and inserts its quoted path, never Enter.
# [clipboard]
# image-directory=/home/your-user/Private clipboard images
