[package]
name = "splinterd"
description = "Persistent terminal topology daemon for Splinterm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
integration-test = []
# TEST-ONLY (Plan 0061 M3.17, operator-approved 2026-10-19): live handoff
# treats window continuity as ready for a local-committed-head package build
# only, so VM acceptance can drive a real live upgrade before the release
# enables it. Every other provenance, Nix-store included, stays refused. A
# binary built with it carries a marker that package provenance generation
# and package validation refuse for every release and Nix package; only an
# explicitly requested local VM acceptance package
# (`tools/package/build-local-package.sh --vm-acceptance-live-handoff`) may
# contain it. No package recipe or release workflow enables it.
vm-acceptance-live-handoff = []
# Exposes the resume-hold constructor the daemon binary's own unit tests use
# (Plan 0061 M3.16). Enabled only through the dev-dependency on this package
# below: Cargo unifies it only when building test targets, never in `cargo
# build` or a packaged release.
test-support = []

[dependencies]
anyhow.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal", "uio", "user"] }
serde.workspace = true
serde_json.workspace = true
seccompiler.workspace = true
sha2.workspace = true
splinterm-core = { path = "../splinterm-core" }
splinterm-filemap = { path = "../splinterm-filemap" }
splinterm-inherited-fd = { path = "../splinterm-inherited-fd" }
splinterm-policy = { path = "../splinterm-policy" }
splinterm-protocol = { path = "../splinterm-protocol" }
splinterm-pty = { path = "../splinterm-pty" }
splinterm-terminal = { path = "../splinterm-terminal" }
rustix = { workspace = true, features = ["system"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { workspace = true, features = ["tokio"] }

[dev-dependencies]
# The daemon binary's unit tests need the library's `test-support` seam.
splinterd = { path = ".", features = ["test-support"] }
proc-macro2 = "1.0"
splinterm-automation-client = { path = "../splinterm-automation-client" }
# The remote consent scenario speaks the graphical relay's outer framing to
# the real `splinterm-relay --graphical-stdio`.
splinterm-graphical-relay = { path = "../splinterm-graphical-relay" }
splinterm-inherited-fd = { path = "../splinterm-inherited-fd", features = ["test-support"] }
splinterm-mcp = { path = "../splinterm-mcp", features = ["integration-test"] }
syn = { version = "2.0", features = ["extra-traits", "full", "visit"] }
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

# Proving that the daemon returns to one thread needs a process where only the
# main thread runs, which the libtest harness never provides: it runs each test
# on a spawned thread.
[[test]]
name = "handoff_runtime_stop"
harness = false

# The exec boundary takes the same process guard, so its stages need the same
# main-thread-only child processes.
[[test]]
name = "handoff_exec_resume"
harness = false

# The full two-generation handoff crosses the same guarded boundary, then
# really execs: its old-generation stages need main-thread-only processes too.
[[test]]
name = "handoff_exec_adoption"
harness = false

# The forward exec call site in a build without the integration-test feature
# (Plan 0061 M3.11b): its stages cross the guarded boundary and really exec.
[[test]]
name = "handoff_exec_production"
harness = false

# A workspace `unsafe_code = "forbid"` cannot be overridden locally. The package
# has exactly two audited post-exec invocations of the inherited-FD leaf crate
# (the candidate claim and the sealed-preflight launcher's closure), so it
# copies the workspace policy with `deny` instead.
# tests/unsafe_boundary_audit.rs pins this exact table and those two exceptions.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
