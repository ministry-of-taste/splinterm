[package]
name = "splinterm"
description = "Persistent Wayland terminal for humans and bounded automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
font-stack-spike = ["dep:fontdb"]

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
atspi.workspace = true
clap.workspace = true
flate2.workspace = true
fontdb = { workspace = true, optional = true }
libc.workspace = true
nix = { workspace = true, features = ["fs", "process", "user"] }
png.workspace = true
rustix = { workspace = true, features = ["system"] }
serde.workspace = true
serde_json.workspace = true
splinterd = { path = "../splinterd" }
splinterm-automation-client = { path = "../splinterm-automation-client" }
splinterm-core = { path = "../splinterm-core" }
splinterm-filemap = { path = "../splinterm-filemap" }
splinterm-freetype = { path = "../splinterm-freetype" }
splinterm-graphical-relay = { path = "../splinterm-graphical-relay" }
splinterm-inherited-fd = { path = "../splinterm-inherited-fd" }
splinterm-policy = { path = "../splinterm-policy" }
splinterm-protocol = { path = "../splinterm-protocol" }
smithay-client-toolkit.workspace = true
swash.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
toml.workspace = true
unicode-casefold.workspace = true
unicode-width.workspace = true
uuid.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus = { workspace = true, features = ["async-io"] }

[dev-dependencies]
sha2.workspace = true
splinterd = { path = "../splinterd", features = ["integration-test"] }
tokio = { workspace = true, features = ["test-util"] }

# A relaunched Window's descriptor claim requires the descriptors it inherits
# to be made inheritable only while one thread spawns it, which the libtest
# harness cannot promise: it runs each test on a spawned thread.
[[test]]
name = "window_resume_exec"
harness = false

[[example]]
name = "font-stack-spike"
required-features = ["font-stack-spike"]

# The workspace forbids `unsafe_code`, which a package cannot relax locally.
# This copy of the workspace table only relaxes it to `deny`, so the binary's
# one audited post-exec descriptor claim (`src/handoff_acquire.rs`, Plan 0061
# D12) can carry its explicit waiver; the library keeps `#![forbid(unsafe_code)]`.
# `splinterd/tests/unsafe_boundary_audit.rs` pins both.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
